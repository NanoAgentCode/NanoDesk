[package]
name = "nano-desk"
version = "0.2.9"
description = "A local productivity client for notes, search, and external LLMs."
authors = ["NanoDesk"]
edition = "2021"
default-run = "nano-desk"

[features]
windows-legacy = ["tauri-plugin-notification/windows7-compat"]

[patch.crates-io]
# ctor 0.8 assumes Windows has vendor=pc; Win7 Rust targets use vendor=win7.
ctor = { path = "vendor/ctor" }

[lib]
name = "nano_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "backup"] }
sqlite-vec = "=0.1.7-alpha.10"
zerocopy = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
thiserror = "1"
futures-util = "0.3"
pdf_oxide = "0.3"
rclip-rtf = "0.1"
quick-xml = "0.31"
encoding_rs = "0.8"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
calamine = "0.26"
ssh2 = "0.9"
base64 = "0.22"
rpassword = "7"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Variant"] }
