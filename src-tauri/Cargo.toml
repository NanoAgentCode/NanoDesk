[package]
name = "nano-desk"
version = "0.1.0"
description = "A local productivity client for notes, search, and external LLMs."
authors = ["NanoDesk"]
edition = "2021"
default-run = "nano-desk"

[lib]
name = "nano_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "backup"] }
sqlite-vec = "=0.1.7-alpha.10"
zerocopy = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["io-util", "process", "rt-multi-thread", "sync", "time"] }
thiserror = "1"
futures-util = "0.3"
pdf_oxide = "0.3"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
calamine = "0.26"
ssh2 = "0.9"
base64 = "0.22"
rpassword = "7"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
